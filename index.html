<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi manga</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #111; color: #fff;
      font-family: Arial, sans-serif; text-align: center;
    }
    header {
      position: sticky; top: 0; z-index: 2;
      padding: 14px 12px; background: #191919;
      border-bottom: 1px solid #333;
    }
    h1 { margin: 0 0 10px; font-size: 22px; }
    nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 8px; padding: 9px 15px;
      background: #333; color: white; font-size: 15px; cursor: pointer;
    }
    button:hover { background: #555; }
    main { width: min(100%, 950px); margin: 0 auto; padding: 12px 8px 35px; }
    .pagina { display: block; width: 100%; height: auto; margin: 0 auto 12px; }
    .nota { color: #aaa; font-size: 13px; padding: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Mi manga</h1>
    <nav>
      <button onclick="document.getElementById('pagina1').scrollIntoView({behavior:'smooth'})">Página 1</button>
      <button onclick="document.getElementById('pagina2').scrollIntoView({behavior:'smooth'})">Página 2</button>
      <button onclick="window.scrollTo({top:0,behavior:'smooth'})">Volver arriba ↑</button>
    </nav>
  </header>
  <main>
    <img id="pagina1" class="pagina" src="imagenes/pagina-1.png" alt="Página 1 del manga">
    <img id="pagina2" class="pagina" src="imagenes/pagina-2.png" alt="Página 2 del manga">
    <div class="nota">Fin de las páginas disponibles.</div>
  </main>
</body>
</html>
